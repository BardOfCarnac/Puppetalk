name: Apply relative depth parity

on:
  push:
    branches: [puppetalk-translation]
    paths:
      - translation/apply-relative-depth-parity.mjs
      - .github/workflows/translation-apply-relative-depth-parity.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply relative depth parity
        run: node translation/apply-relative-depth-parity.mjs
      - name: Check parity script syntax
        run: node --check translation/live-browser-parity.mjs
      - name: Commit parity update
        run: |
          if git diff --quiet -- translation/live-browser-parity.mjs; then
            echo 'Relative depth parity patch produced no changes.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add translation/live-browser-parity.mjs
          git commit -m 'Make depth browser parity relative to starting plane'
          git push
