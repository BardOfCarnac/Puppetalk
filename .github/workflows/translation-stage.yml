name: Translation stage contracts

on:
  push:
    branches: [puppetalk-translation]
  pull_request:

jobs:
  stage-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --check translation/stage/stage-loop.js
      - run: node translation/stage/stage-loop-smoke.mjs
      - run: node --check translation/stage/stage-lifecycle.js
      - run: node translation/stage/stage-lifecycle-smoke.mjs
      - run: node --check translation/build-runtime.mjs
      - run: node translation/runtime-parity-smoke.mjs
