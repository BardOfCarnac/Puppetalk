name: Smoke check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: node --check server.mjs
      - run: node --check public/app.js
      - run: node --check app.js
      - run: node --check boot.js
      - run: node --check stability.js
      - run: node --check pose-tuning.js
      - run: node --check locomotion.js
