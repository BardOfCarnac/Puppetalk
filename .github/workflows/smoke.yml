name: Smoke check

on:
  push:
    branches: [main, puppetalk-translation]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --check server.mjs
      - run: node --check public/app.js
      - run: node --check app.js
      - run: node --check boot.js
      - run: node --check translation/manifest.mjs
      - run: node --check translation/build-preboot.mjs
      - run: node --check translation/precomposed-fetch.js
      - run: node --check translation/generated-parity-smoke.mjs
      - run: node translation/manifest-smoke.mjs
      - run: node translation/entry-smoke.mjs
      - run: node translation/generated-parity-smoke.mjs
      - run: node --check translation/generated/app-preboot.js
      - run: node --check translation/generated/app-final.js
      - run: node --check translation/character/rig-core.js
      - run: node translation/character/rig-core-smoke.mjs
      - run: node --check translation/build-runtime.mjs
      - run: node --check translation/runtime-parity-smoke.mjs
      - run: node translation/runtime-parity-smoke.mjs
      - run: node --check translation/runtime/app.js
      - run: node --check translation/bootstrap.js
      - run: node --check lobby-routing.js
      - run: node --check profile-name-patch.js
      - run: node --check look-sync-patch.js
      - run: node --check live-face-render-patch.js
      - run: node creator-smoke.mjs
      - run: node --check stability.js
      - run: node --check pose-tuning.js
      - run: node --check foreground-tuning.js
      - run: node --check slice-depth-compat.js
      - run: node --check seat-view.js
      - run: node --check locomotion.js
      - run: node --check device-projection.js
      - run: node --check segmented-stance-compat.js
      - run: node segmented-stance-smoke.mjs
      - run: node --check jump-feel.js
      - run: node --check control-feel.js
      - run: node --check fullscreen-controller.js
      - run: node --check look-migration.js
      - run: node --check line-face-mouths-patch.js
      - run: node --check line-face-features-patch.js
      - run: node --check face-spacing-patch.js
      - run: node --check toy-system.js
      - run: node --check toy-tap.js
      - run: node --check dart-stick.js
      - run: node --check balloon-tie.js
      - run: node --check toy-throw.js
      - run: node --check prop-extremities.js
      - run: node --check balloon-buoyancy.js
      - run: node --check dart-balloon-pop.js
      - run: node --check severable-joints.js
      - run: node --check laser-frisbee.js
      - run: node --check item-polish.js
      - run: node --check special-items.js
      - run: node special-items-smoke.mjs
      - run: node --check segmented-puppet.js
      - run: node --check seat-render.js
      - run: node --check depth-assist.js
      - run: node --check visual-thickness.js
      - run: node --check body-slicing.js
      - run: node --check voice-layer.js
      - run: node --check voice-stage-compat.js
      - run: node --check sound-runtime.js
      - run: node sound-runtime-smoke.mjs
      - run: node --check sound-sidecar.js
      - run: node sound-sidecar-smoke.mjs
      - run: node --check compose-smoke.mjs
      - run: node compose-smoke.mjs
      - run: node --check boot-final-smoke.mjs
      - run: node boot-final-smoke.mjs
      - name: Translation browser parity smoke
        run: |
          python3 -m http.server 8081 >/tmp/translation-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          sleep 1
          google-chrome --headless --no-sandbox --disable-gpu --virtual-time-budget=5000 --dump-dom http://127.0.0.1:8081/translation/ >/tmp/translation-lobby.html 2>/tmp/translation-lobby-chrome.log || true
          if ! grep -q 'id="character-name"' /tmp/translation-lobby.html || ! grep -q 'PUPPETALK' /tmp/translation-lobby.html; then
            echo 'Translation did not preserve the Puppetalk pre-show lobby.'
            cat /tmp/translation-lobby-chrome.log || true
            echo '--- DOM ---'
            cat /tmp/translation-lobby.html || true
            exit 1
          fi
          google-chrome --headless --no-sandbox --disable-gpu --virtual-time-budget=5000 --dump-dom 'http://127.0.0.1:8081/translation/?mode=controller&room=SMOKE&lobby=done' >/tmp/translation-controller.html 2>/tmp/translation-controller-chrome.log || true
          if ! grep -q 'personal-controller' /tmp/translation-controller.html || ! grep -q 'controller-footer' /tmp/translation-controller.html; then
            echo 'Translation did not boot the translated Puppetalk character runtime.'
            cat /tmp/translation-controller-chrome.log || true
            echo '--- DOM ---'
            cat /tmp/translation-controller.html || true
            exit 1
          fi
      - run: node --check hollerday/src/config.js
      - run: node --check hollerday/src/camera.js
      - run: node --check hollerday/src/network.js
      - run: node --check hollerday/src/behaviour.js
      - run: node hollerday/behaviour-smoke.mjs
      - run: node --check hollerday/src/segmentation.js
      - run: node hollerday/segmentation-smoke.mjs
      - run: node --check hollerday/src/rig.js
      - run: node --check hollerday/src/character-ui.js
      - run: node --check hollerday/src/props.js
      - run: node --check hollerday/src/scenes.js
      - run: node --check hollerday/src/seat-projection.js
      - run: node --check hollerday/src/main.js
      - name: Hollerday browser boot smoke
        run: |
          python3 -m http.server 8080 >/tmp/hollerday-http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          sleep 1
          google-chrome --headless --no-sandbox --disable-gpu --virtual-time-budget=5000 --dump-dom http://127.0.0.1:8080/hollerday/ >/tmp/hollerday-dom.html 2>/tmp/hollerday-chrome.log || true
          if ! grep -q 'characterChoice' /tmp/hollerday-dom.html; then
            echo 'Hollerday did not finish browser initialization.'
            cat /tmp/hollerday-chrome.log || true
            echo '--- DOM ---'
            cat /tmp/hollerday-dom.html || true
            exit 1
          fi
          google-chrome --headless --no-sandbox --disable-gpu --virtual-time-budget=5000 --dump-dom 'http://127.0.0.1:8080/hollerday/?room=SMOKE&host=1' >/tmp/hollerday-host.html 2>/tmp/hollerday-host-chrome.log || true
          if ! grep -q 'TABLE SMOKE' /tmp/hollerday-host.html || ! grep -q '>Table open<' /tmp/hollerday-host.html; then
            echo 'Hollerday host did not reach its running table state.'
            cat /tmp/hollerday-host-chrome.log || true
            echo '--- HOST DOM ---'
            cat /tmp/hollerday-host.html || true
            exit 1
          fi
