name: Smoke check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --check server.mjs
      - run: node --check public/app.js
      - run: node --check app.js
      - run: node --check boot.js
      - run: node --check lobby-routing.js
      - run: node --check profile-name-patch.js
      - run: node --check look-sync-patch.js
      - run: node --check live-face-render-patch.js
      - run: node creator-smoke.mjs
      - run: node --check stability.js
      - run: node --check pose-tuning.js
      - run: node --check foreground-tuning.js
      - run: node --check slice-depth-compat.js
      - run: node --check seat-view.js
      - run: node --check locomotion.js
      - run: node --check device-projection.js
      - run: node --check segmented-stance-compat.js
      - run: node segmented-stance-smoke.mjs
      - run: node --check jump-feel.js
      - run: node --check control-feel.js
      - run: node --check fullscreen-controller.js
      - run: node --check look-migration.js
      - run: node --check line-face-mouths-patch.js
      - run: node --check line-face-features-patch.js
      - run: node --check face-spacing-patch.js
      - run: node --check toy-system.js
      - run: node --check toy-tap.js
      - run: node --check dart-stick.js
      - run: node --check balloon-tie.js
      - run: node --check toy-throw.js
      - run: node --check prop-extremities.js
      - run: node --check balloon-buoyancy.js
      - run: node --check dart-balloon-pop.js
      - run: node --check severable-joints.js
      - run: node --check laser-frisbee.js
      - run: node --check item-polish.js
      - run: node --check special-items.js
      - run: node special-items-smoke.mjs
      - run: node --check segmented-puppet.js
      - run: node --check seat-render.js
      - run: node --check depth-assist.js
      - run: node --check body-slicing.js
      - run: node --check voice-layer.js
      - run: node --check voice-stage-compat.js
      - run: node --check sound-runtime.js
      - run: node sound-runtime-smoke.mjs
      - run: node --check sound-sidecar.js
      - run: node sound-sidecar-smoke.mjs
      - run: node compose-smoke.mjs
      - run: node --check boot-final-smoke.mjs
      - run: node boot-final-smoke.mjs
