name: Translation Core

on:
  push:
    branches: [puppetalk-translation, puppetalk-shared-hex-space]
    paths:
      - 'translation/core/**'
      - 'translation/build-runtime.mjs'
      - 'translation/runtime/app.js'
      - 'translation/index.html'
      - 'translation/entry-smoke.mjs'
      - 'translation/runtime-parity-smoke.mjs'
      - '.github/workflows/translation-core.yml'

jobs:
  core-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Runtime helper contract
        run: node translation/core/runtime-helpers-smoke.mjs
      - name: Runtime route/config contract
        run: node translation/core/runtime-route-smoke.mjs
      - name: Depth interaction contract
        run: |
          node --check translation/core/depth-system.js
          node translation/core/depth-system-smoke.mjs
      - name: Shared hex geometry contract
        run: |
          node --check translation/core/shared-hex-space.js
          node translation/core/shared-hex-space-smoke.mjs
          node --check translation/core/shared-hex-integration.js
          node translation/core/shared-hex-integration-smoke.mjs
          node --check translation/core/shared-hex-tuning.js
          node translation/core/shared-hex-tuning-smoke.mjs
      - name: Translation entry smoke
        run: node translation/entry-smoke.mjs
      - name: Runtime parity
        run: node translation/runtime-parity-smoke.mjs
