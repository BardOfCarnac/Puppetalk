name: Translation prop contracts

on:
  push:
    branches: [puppetalk-translation]
  pull_request:

jobs:
  prop-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --check translation/props/contact-physics.js
      - run: node translation/props/contact-physics-smoke.mjs
      - run: node --check translation/props/dart-impacts.js
      - run: node translation/props/dart-impacts-smoke.mjs
      - run: node --check translation/props/attachment-core.js
      - run: node translation/props/attachment-core-smoke.mjs
      - run: node --check translation/props/grip-core.js
      - run: node translation/props/grip-core-smoke.mjs
      - run: node --check translation/props/prop-geometry.js
      - run: node translation/props/prop-geometry-smoke.mjs
      - run: node --check translation/build-runtime.mjs
      - run: node --check translation/runtime-parity-smoke.mjs
      - run: node translation/runtime-parity-smoke.mjs
      - run: node translation/entry-smoke.mjs
      - run: node --check translation/runtime/app.js
