name: Translation prop contracts

on:
  push:
    branches: [puppetalk-translation]
  pull_request:

jobs:
  prop-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --check translation/props/contact-physics.js
      - run: node translation/props/contact-physics-smoke.mjs
      - run: node --check translation/props/dart-impacts.js
      - run: node translation/props/dart-impacts-smoke.mjs
      - run: node --check translation/props/attachment-core.js
      - run: node translation/props/attachment-core-smoke.mjs
      - run: node --check translation/props/grip-core.js
      - run: node translation/props/grip-core-smoke.mjs
      - run: node --check translation/props/prop-geometry.js
      - run: node translation/props/prop-geometry-smoke.mjs
      - run: node --check translation/props/prop-state.js
      - run: node translation/props/prop-state-smoke.mjs
      - run: node --check translation/props/prop-factory.js
      - run: node translation/props/prop-factory-smoke.mjs
      - run: node --check translation/props/pump-balloon.js
      - run: node translation/props/pump-balloon-smoke.mjs
      - run: node --check translation/props/balloon-pops.js
      - run: node translation/props/balloon-pops-smoke.mjs
      - run: node --check translation/props/balloon-lift.js
      - run: node translation/props/balloon-lift-smoke.mjs
      - run: node --check translation/props/prop-driver.js
      - run: node translation/props/prop-driver-smoke.mjs
      - run: node --check translation/props/laser-frisbee.js
      - run: node translation/props/laser-frisbee-smoke.mjs
      - run: node --check translation/props/depth-assist.js
      - run: node translation/props/depth-assist-smoke.mjs
      - run: node --check translation/props/prop-input.js
      - run: node translation/props/prop-input-smoke.mjs
      - run: node --check translation/props/special-items.js
      - run: node translation/props/special-items-smoke.mjs
      - run: node --check translation/build-runtime.mjs
      - run: node --check translation/runtime-parity-smoke.mjs
      - run: node translation/runtime-parity-smoke.mjs
      - run: node translation/entry-smoke.mjs
      - run: node --check translation/runtime/app.js
