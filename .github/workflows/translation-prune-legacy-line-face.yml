name: Prune dead translated legacy line-face renderer

on:
  push:
    branches: [puppetalk-translation]

permissions:
  contents: write

jobs:
  prune:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node translation/render/legacy-line-face-dead-code-smoke.mjs
      - run: node --check translation/apply-legacy-line-face-prune.mjs
      - run: node translation/apply-legacy-line-face-prune.mjs
      - run: node --check translation/build-runtime.mjs
      - run: node --check translation/runtime-parity-smoke.mjs
      - run: node translation/build-runtime.mjs
      - run: node --check translation/runtime/app.js
      - run: node translation/runtime-parity-smoke.mjs
      - run: node translation/entry-smoke.mjs
      - run: node translation/render/scene-renderer-smoke.mjs
      - run: node translation/render/seat-projection-smoke.mjs
      - run: node translation/render/legacy-line-face-dead-code-smoke.mjs
      - name: Commit pruned translated runtime
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add translation/build-runtime.mjs translation/runtime-parity-smoke.mjs translation/runtime/app.js
          if git diff --cached --quiet; then
            echo 'Dead legacy line-face renderer already pruned.'
            exit 0
          fi
          git commit -m 'Prune dead legacy line-face renderer'
          git push origin HEAD:${GITHUB_REF_NAME}
