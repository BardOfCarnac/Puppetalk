name: Promote Stage App Composition

on:
  push:
    branches: [puppetalk-translation]

permissions:
  contents: write

jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify candidate contract
        run: |
          node --check translation/stage/app.js
          node translation/stage/app-smoke.mjs
      - name: Detect existing promotion
        id: promotion
        run: |
          if grep -q 'PuppetalkStageApp' translation/build-runtime.mjs && grep -q './translation/stage/app.js?v=1' translation/index.html; then
            echo 'needed=false' >> "$GITHUB_OUTPUT"
            echo 'Stage app composition is already promoted.'
          else
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Apply stage app slice
        if: steps.promotion.outputs.needed == 'true'
        run: node translation/apply-stage-app.mjs
      - name: Rebuild translated runtime
        if: steps.promotion.outputs.needed == 'true'
        run: |
          node --check translation/build-runtime.mjs
          node translation/build-runtime.mjs
          node --check translation/runtime/app.js
          node translation/entry-smoke.mjs
          node translation/runtime-parity-smoke.mjs
          git diff --check
      - name: Commit promoted stage app
        if: steps.promotion.outputs.needed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add translation/build-runtime.mjs translation/index.html translation/entry-smoke.mjs translation/runtime-parity-smoke.mjs translation/runtime/app.js
          git commit -m "Promote stage app composition"
          git push
