name: Apply walking frame parity

on:
  push:
    branches: [puppetalk-translation]
    paths:
      - 'translation/apply-walking-frame-parity.mjs'
      - '.github/workflows/translation-apply-walking-frame-parity.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: puppetalk-translation
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply full-frame walking parity patch
        run: node translation/apply-walking-frame-parity.mjs
      - name: Check parity script syntax
        run: node --check translation/live-browser-parity.mjs
      - name: Commit walking parity harness
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add translation/live-browser-parity.mjs
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Advance full stage frames in walking parity"
          git push origin HEAD:puppetalk-translation
