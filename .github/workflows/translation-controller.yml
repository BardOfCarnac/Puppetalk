name: Translation controller contracts

on:
  push:
    branches: [puppetalk-translation]
  pull_request:

jobs:
  controller-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --check translation/controller/throw-gesture.js
      - run: node translation/controller/throw-gesture-smoke.mjs
      - run: node --check translation/controller/audio-controls.js
      - run: node translation/controller/audio-controls-smoke.mjs
      - run: node --check translation/controller/character-creator.js
      - run: node translation/controller/character-creator-smoke.mjs
      - run: node --check translation/controller/item-interactions.js
      - run: node translation/controller/item-interactions-smoke.mjs
      - run: node --check translation/controller/puppet-interaction.js
      - run: node translation/controller/puppet-interaction-smoke.mjs
      - run: node --check translation/build-runtime.mjs
      - run: node --check translation/runtime-parity-smoke.mjs
      - run: node translation/runtime-parity-smoke.mjs
      - run: node translation/entry-smoke.mjs
      - run: node --check translation/runtime/app.js
