name: Promote Runtime Helpers

on:
  push:
    branches: [puppetalk-translation]
    paths:
      - 'translation/apply-runtime-helper-slice.mjs'
      - '.github/workflows/translation-runtime-helper-promotion.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply runtime helper slice
        run: node translation/apply-runtime-helper-slice.mjs
      - name: Check contracts and rebuild runtime
        run: |
          node translation/core/runtime-helpers-smoke.mjs
          node --check translation/build-runtime.mjs
          node translation/build-runtime.mjs
          node --check translation/runtime/app.js
          node translation/entry-smoke.mjs
          node translation/runtime-parity.mjs
      - name: Commit promoted runtime helper slice
        run: |
          if git diff --quiet -- translation/build-runtime.mjs translation/index.html translation/entry-smoke.mjs translation/runtime/app.js; then
            echo 'No promotion changes produced.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add translation/build-runtime.mjs translation/index.html translation/entry-smoke.mjs translation/runtime/app.js
          git commit -m 'Promote frozen runtime helpers'
          git push
