name: Diagnose mature depth scene

on:
  push:
    branches: [puppetalk-translation]
    paths:
      - translation/diagnose-depth-scene.mjs
      - .github/workflows/translation-diagnose-depth-scene.yml

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Start parity server
        run: |
          python3 -m http.server 8082 >/tmp/puppetalk-parity-http.log 2>&1 &
          echo $! >/tmp/puppetalk-parity-server.pid
          sleep 1
      - name: Instrument scene diagnostics
        run: node translation/diagnose-depth-scene.mjs
      - name: Check syntax
        run: node --check translation/live-browser-parity.mjs
      - name: Run live browser diagnostic
        env:
          PUPPETALK_PARITY_BASE: http://127.0.0.1:8082
        run: node translation/live-browser-parity.mjs
      - name: Stop parity server
        if: always()
        run: kill $(cat /tmp/puppetalk-parity-server.pid) || true
