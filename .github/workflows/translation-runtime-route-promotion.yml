name: Promote Runtime Route

on:
  push:
    branches: [puppetalk-translation]
    paths:
      - 'translation/apply-runtime-route-slice.mjs'
      - '.github/workflows/translation-runtime-route-promotion.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply runtime route/config slice
        run: node translation/apply-runtime-route-slice.mjs
      - name: Verify translated runtime
        run: |
          node translation/core/runtime-helpers-smoke.mjs
          node translation/core/runtime-route-smoke.mjs
          node --check translation/build-runtime.mjs
          node translation/build-runtime.mjs
          node --check translation/runtime/app.js
          node translation/entry-smoke.mjs
          node translation/runtime-parity-smoke.mjs
      - name: Commit promoted route/config slice
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add translation/build-runtime.mjs translation/index.html translation/entry-smoke.mjs translation/runtime-parity-smoke.mjs translation/runtime/app.js
          if git diff --cached --quiet; then
            echo 'No route/config promotion changes produced.'
            exit 0
          fi
          git commit -m 'Promote frozen runtime route and config'
          git push
