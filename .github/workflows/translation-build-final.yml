name: Build translated final source

on:
  push:
    branches: [puppetalk-translation]

permissions:
  contents: write

jobs:
  build-final:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --check translation/build-final.mjs
      - run: node translation/build-final.mjs
      - run: node --check translation/generated/app-final.js
      - name: Commit frozen final source
        run: |
          if [ -z "$(git status --porcelain -- translation/generated/app-final.js)" ]; then
            echo 'Final translated source already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add translation/generated/app-final.js
          git commit -m 'Build frozen final Puppetalk source'
          git push origin HEAD:${GITHUB_REF_NAME}
