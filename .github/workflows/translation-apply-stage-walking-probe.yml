name: Apply stage walking probe

on:
  push:
    branches: [puppetalk-translation]
    paths:
      - translation/apply-stage-walking-probe.mjs
      - .github/workflows/translation-apply-stage-walking-probe.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply stage-side walking probe
        run: node translation/apply-stage-walking-probe.mjs
      - name: Check parity script syntax
        run: node --check translation/live-browser-parity.mjs
      - name: Commit stage-side walking probe
        run: |
          if git diff --quiet -- translation/live-browser-parity.mjs; then
            echo 'Stage walking probe patch produced no changes.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add translation/live-browser-parity.mjs
          git commit -m 'Measure body-drag walking on stage bodies'
          git push
