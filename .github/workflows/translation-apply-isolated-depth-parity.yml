name: Apply isolated depth parity

on:
  push:
    branches: [puppetalk-translation]
    paths:
      - translation/apply-isolated-depth-parity.mjs
      - .github/workflows/translation-apply-isolated-depth-parity.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply isolated depth parity
        run: node translation/apply-isolated-depth-parity.mjs
      - name: Check parity script syntax
        run: node --check translation/live-browser-parity.mjs
      - name: Commit parity ordering
        run: |
          if git diff --quiet -- translation/live-browser-parity.mjs; then
            echo 'Isolated depth parity patch produced no changes.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add translation/live-browser-parity.mjs
          git commit -m 'Isolate depth browser parity from torso controls'
          git push
