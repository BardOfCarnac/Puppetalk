name: Repair and Promote Runtime Helpers

on:
  push:
    branches: [puppetalk-translation]
    paths:
      - 'translation/repair-and-promote-runtime-helpers.mjs'
      - '.github/workflows/translation-runtime-helper-repair.yml'

permissions:
  contents: write

jobs:
  repair-promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Restore parity contract and apply helper slice
        run: |
          node translation/repair-and-promote-runtime-helpers.mjs
          node translation/apply-runtime-helper-slice.mjs
      - name: Verify translated runtime
        run: |
          node translation/core/runtime-helpers-smoke.mjs
          node --check translation/build-runtime.mjs
          node translation/build-runtime.mjs
          node --check translation/runtime/app.js
          node translation/entry-smoke.mjs
          node translation/runtime-parity-smoke.mjs
      - name: Commit repaired parity and promoted helpers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add translation/runtime-parity-smoke.mjs translation/build-runtime.mjs translation/index.html translation/entry-smoke.mjs translation/runtime/app.js
          if git diff --cached --quiet; then
            echo 'No repair/promotion changes produced.'
            exit 0
          fi
          git commit -m 'Promote frozen runtime helpers'
          git push
