<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#0b0c0e" />
<title>Puppetalk · Character</title>
<style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b0c0e;color:#f4f5f7}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#0b0c0e}button{font:inherit;color:inherit}body{min-height:100dvh;overflow-x:hidden;background:radial-gradient(circle at 60% 33%,#24272d 0,#15171b 36%,#0b0c0e 72%)}.shell{min-height:100dvh;display:grid;grid-template-rows:auto minmax(310px,1fr) auto}header{padding:max(14px,env(safe-area-inset-top)) 18px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:relative;z-index:4}.brand{font-weight:900;letter-spacing:.14em;font-size:13px}.sub{font-size:11px;color:#9da1aa;text-align:right}.stage{position:relative;min-height:360px;display:grid;place-items:center;overflow:hidden}.stage:before{content:"";position:absolute;left:50%;bottom:7%;width:min(58vw,330px);height:54px;transform:translateX(-50%);border-radius:50%;background:rgba(0,0,0,.38);filter:blur(4px)}canvas{width:min(92vw,620px);height:min(58vh,540px);display:block;position:relative;z-index:1;touch-action:none}.hint{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#7f848e;white-space:nowrap}.panel{position:relative;z-index:5;background:rgba(16,18,22,.95);border-top:1px solid rgba(255,255,255,.1);border-radius:24px 24px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -14px 40px rgba(0,0,0,.28)}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}.panel-head strong{font-size:16px}.panel-actions{display:flex;gap:7px}.pill{border:1px solid rgba(255,255,255,.14);background:#1b1e24;padding:9px 13px;border-radius:999px;font-weight:700;font-size:12px;min-height:40px}.pill.active{background:#eceff3;color:#101216}.section{display:grid;grid-template-columns:72px minmax(0,1fr);gap:10px;align-items:center;margin:9px 0}.label{font-size:10px;font-weight:800;color:#8f949d;text-transform:uppercase;letter-spacing:.08em}.choices{display:flex;gap:7px;overflow-x:auto;padding:3px 2px 5px;scrollbar-width:none}.choices::-webkit-scrollbar{display:none}.choice{flex:0 0 auto;min-width:58px;height:40px;border:1px solid rgba(255,255,255,.12);background:#17191e;border-radius:12px;padding:7px 9px;font-size:11px;text-transform:capitalize}.choice.active{border-color:#fff;background:#eceff3;color:#101216;font-weight:800}.swatch{flex:0 0 32px;width:32px;height:32px;border-radius:50%;border:2px solid rgba(255,255,255,.14);background:var(--c);padding:0;box-shadow:inset 0 0 0 2px rgba(0,0,0,.18)}.swatch.active{outline:2px solid #fff;outline-offset:2px}.start-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:15px}.start-row button{min-height:45px;border-radius:14px;border:1px solid rgba(255,255,255,.12);background:#191c21;font-weight:800}.start-row .primary{background:#f0f2f5;color:#101216}.start-row button:disabled{opacity:.42}@media(min-width:800px){.shell{grid-template-columns:minmax(360px,1fr) minmax(390px,470px);grid-template-rows:auto 1fr}.shell header{grid-column:1/-1}.stage{grid-column:1;grid-row:2;min-height:0}.panel{grid-column:2;grid-row:2;border-radius:24px 0 0 0;border-top:1px solid rgba(255,255,255,.08);border-left:1px solid rgba(255,255,255,.08);overflow:auto;padding:24px}.section{grid-template-columns:84px 1fr}.hint{bottom:26px}}
</style>
</head>
<body>
<main class="shell">
<header><div class="brand">PUPPETALK</div><div class="sub">make somebody<br>then enter the table</div></header>
<section class="stage"><canvas id="preview" width="620" height="540" aria-label="Puppet preview"></canvas><div class="hint">character preview</div></section>
<section class="panel">
<div class="panel-head"><strong>Your character</strong><div class="panel-actions"><button class="pill" id="talk" type="button">Hold to talk</button><button class="pill" id="random" type="button">Randomise</button></div></div>
<div class="section"><div class="label">Colour</div><div class="choices" id="colors"></div></div>
<div class="section"><div class="label">Head</div><div class="choices" data-key="headStyle"></div></div>
<div class="section"><div class="label">Eyes</div><div class="choices" data-key="eyes"></div></div>
<div class="section"><div class="label">Nose</div><div class="choices" data-key="nose"></div></div>
<div class="section"><div class="label">Mouth</div><div class="choices" data-key="mouth"></div></div>
<div class="section"><div class="label">Extra</div><div class="choices" data-key="extra"></div></div>
<div class="start-row"><button type="button" id="join">Join table</button><button type="button" class="primary" id="start">Start table</button></div>
</section>
</main>
<script>
const palette=['#cf6c63','#d0a950','#7089b9','#729d78','#a879b2','#67a7a8','#d79b75','#8a6d5b','#d9c3a7','#7e8794','#d65050','#5b8fd1'];
const parts={headStyle:['smooth','spikes','tallSpikes','burst','scallop','tufts','swept','fringe'],eyes:['closed','dots','happy','mismatch','sleepy','unevenDots','wink','winkRight'],nose:['angular','bow','curve','hook','long','slant'],mouth:['frown','line','pleased','shy','smile','smirk','soft','wavy'],extra:['none','glasses','moustache','freckles','eyepatch']};
const eyes={closed:[{d:'M6 5q6 5 13 0m24 0q7 5 13 0',w:4.2}],dots:[{d:'M12 6h.01M50 6h.01',w:7}],happy:[{d:'M6 7q6-6 13 0m24 0q7-6 13 0',w:4.2}],mismatch:[{d:'M6 5q6 5 13 0m24 1q7 1.5 13 0',w:4.2}],sleepy:[{d:'M6 6q7 1.5 13 0m24 0q7 1.5 13 0',w:4.2}],unevenDots:[{d:'M12 4.5h.01M50 7.5h.01',w:7}],wink:[{d:'M6 5q6 5 13 0',w:4.2},{d:'M50 6h.01',w:7}],winkRight:[{d:'M12 6h.01',w:7},{d:'M43 5q7 5 13 0',w:4.2}]};
const noses={angular:'M13 6 7 26l8 2.5',bow:'M13 5c-5.5 8-8 16-6 24',curve:'M12 6c-2.5 8-7 15-6 22q.5 5 6 4',hook:'M13 5 5.5 27q-1 6.5 5.5 5.5',long:'M15 3 4 30q-1.5 5.5 6 5',slant:'M13 5 6 29'};
const mouths={frown:{d:'M7 11q15-6.5 29-1',open:11},line:{d:'m8 10 28-2',open:12},pleased:{d:'M4 9q16 7 30-1l7-5',open:13},shy:{d:'M15 9.5q8 4 16-1',open:9},smile:{d:'M3 9q19 10 38-3',open:14},smirk:{d:'M9 10q14 4 26-4',open:12},soft:{d:'M6 9q16 6 32-2',open:12},wavy:{d:'M6 10q7-4 14 0 8 4.5 18-2',open:12}};
function legacyHeadStyle(v){if(v?.headStyle&&parts.headStyle.includes(v.headStyle))return v.headStyle;if(v?.hair==='tuft')return'tufts';if(v?.hair==='wave')return'swept';if(v?.hair==='mop')return'scallop';if(v?.hair==='cap')return'fringe';if(v?.hair==='crop')return'spikes';if(v?.head==='long')return'tallSpikes';if(v?.head==='wide')return'burst';return'spikes'}
let stored={};try{stored=JSON.parse(localStorage.getItem('puppetalk-look')||'{}')||{}}catch{}
let look={color:palette.includes(stored.color)?stored.color:palette[0],headStyle:legacyHeadStyle(stored),eyes:parts.eyes.includes(stored.eyes)?stored.eyes:'dots',nose:parts.nose.includes(stored.nose)?stored.nose:'curve',mouth:parts.mouth.includes(stored.mouth)?stored.mouth:'line',extra:parts.extra.includes(stored.extra)?stored.extra:'none'};
const c=document.querySelector('#preview'),ctx=c.getContext('2d'),pick=a=>a[Math.floor(Math.random()*a.length)];let talkState=0,talkTimer=null;const sampleCache=new Map();
function pretty(v){return v.replace(/([a-z])([A-Z])/g,'$1 $2')}
function save(){localStorage.setItem('puppetalk-look',JSON.stringify(look));renderControls();draw()}
function button(text,key){const b=document.createElement('button');b.type='button';b.className='choice'+(look[key]===text?' active':'');b.textContent=pretty(text);b.onclick=()=>{look[key]=text;save()};return b}
function renderControls(){const colors=document.querySelector('#colors');colors.innerHTML='';for(const color of palette){const b=document.createElement('button');b.type='button';b.className='swatch'+(look.color===color?' active':'');b.style.setProperty('--c',color);b.title=color;b.onclick=()=>{look.color=color;save()};colors.append(b)}for(const [key,vals] of Object.entries(parts)){const row=document.querySelector(`[data-key="${key}"]`);row.innerHTML='';vals.forEach(v=>row.append(button(v,key)))}}
document.querySelector('#random').onclick=()=>{look={color:pick(palette),headStyle:pick(parts.headStyle),eyes:pick(parts.eyes),nose:pick(parts.nose),mouth:pick(parts.mouth),extra:pick(parts.extra)};save()};
const talk=document.querySelector('#talk');function startTalk(e){e.preventDefault();if(talkTimer)return;talk.classList.add('active');let phase=0;const flap=()=>{phase=(phase+1)%3;talkState=phase===0?1:phase===1?2:1;draw()};flap();talkTimer=setInterval(flap,105)}function stopTalk(){if(talkTimer){clearInterval(talkTimer);talkTimer=null}talkState=0;talk.classList.remove('active');draw()}talk.addEventListener('pointerdown',startTalk);talk.addEventListener('pointerup',stopTalk);talk.addEventListener('pointercancel',stopTalk);talk.addEventListener('pointerleave',e=>{if(e.buttons)stopTalk()});
function headPath(style,r){const p=(x,y)=>[x*r,y*r];ctx.beginPath();if(style==='spikes'){ctx.moveTo(...p(-.82,.58));ctx.bezierCurveTo(...p(-1.02,.12),...p(-.96,-.32),...p(-.72,-.58));[[-.60,-.94],[-.42,-.66],[-.20,-1.02],[0,-.68],[.22,-1.03],[.42,-.66],[.62,-.92],[.73,-.56]].forEach(q=>ctx.lineTo(...p(...q)));ctx.bezierCurveTo(...p(1,-.28),...p(1.02,.24),...p(.82,.58));ctx.bezierCurveTo(...p(.62,.96),...p(.28,1.05),...p(0,1.03));ctx.bezierCurveTo(...p(-.3,1.05),...p(-.62,.96),...p(-.82,.58))}else if(style==='tallSpikes'){ctx.moveTo(...p(-.78,.62));ctx.bezierCurveTo(...p(-1,.12),...p(-.93,-.28),...p(-.68,-.48));[[-.58,-1.12],[-.34,-.64],[-.18,-1.28],[.04,-.66],[.24,-1.22],[.43,-.61],[.61,-1.08],[.72,-.48]].forEach(q=>ctx.lineTo(...p(...q)));ctx.bezierCurveTo(...p(.98,-.24),...p(1,.26),...p(.78,.62));ctx.bezierCurveTo(...p(.58,.98),...p(.25,1.06),...p(0,1.04));ctx.bezierCurveTo(...p(-.28,1.06),...p(-.58,.98),...p(-.78,.62))}else if(style==='burst'){ctx.moveTo(...p(-.76,.68));[[-1.05,.30],[-.82,.05],[-1.08,-.18],[-.78,-.35],[-.92,-.70],[-.55,-.67],[-.48,-1.03],[-.18,-.78],[.02,-1.12],[.20,-.77],[.52,-1.02],[.56,-.65],[.94,-.72],[.80,-.35],[1.08,-.16],[.82,.05],[1.04,.32],[.76,.68]].forEach(q=>ctx.lineTo(...p(...q)));ctx.bezierCurveTo(...p(.55,.98),...p(.25,1.06),...p(0,1.04));ctx.bezierCurveTo(...p(-.28,1.06),...p(-.55,.98),...p(-.76,.68))}else if(style==='scallop'){ctx.moveTo(...p(-.84,.62));ctx.bezierCurveTo(...p(-1,.18),...p(-.98,-.24),...p(-.72,-.48));ctx.quadraticCurveTo(...p(-.62,-.88),...p(-.35,-.72));ctx.quadraticCurveTo(...p(-.22,-1.05),...p(.02,-.76));ctx.quadraticCurveTo(...p(.20,-1.05),...p(.39,-.72));ctx.quadraticCurveTo(...p(.63,-.93),...p(.76,-.48));ctx.bezierCurveTo(...p(1,-.22),...p(1,.24),...p(.84,.62));ctx.bezierCurveTo(...p(.62,.98),...p(.27,1.06),...p(0,1.04));ctx.bezierCurveTo(...p(-.3,1.06),...p(-.62,.98),...p(-.84,.62))}else if(style==='tufts'){ctx.moveTo(...p(-.83,.62));ctx.bezierCurveTo(...p(-1,.18),...p(-.97,-.30),...p(-.67,-.55));ctx.quadraticCurveTo(...p(-.56,-1.03),...p(-.25,-.68));ctx.quadraticCurveTo(...p(-.05,-1.18),...p(.15,-.68));ctx.quadraticCurveTo(...p(.48,-1.08),...p(.68,-.52));ctx.bezierCurveTo(...p(.98,-.28),...p(1,.24),...p(.83,.62));ctx.bezierCurveTo(...p(.62,.98),...p(.27,1.06),...p(0,1.04));ctx.bezierCurveTo(...p(-.3,1.06),...p(-.62,.98),...p(-.83,.62))}else if(style==='swept'){ctx.moveTo(...p(-.84,.60));ctx.bezierCurveTo(...p(-1,.12),...p(-.94,-.30),...p(-.64,-.55));ctx.bezierCurveTo(...p(-.36,-.90),...p(.03,-.72),...p(.25,-1.18));ctx.bezierCurveTo(...p(.32,-.82),...p(.69,-.98),...p(.68,-.55));ctx.bezierCurveTo(...p(.99,-.30),...p(1.01,.25),...p(.84,.60));ctx.bezierCurveTo(...p(.62,.98),...p(.27,1.06),...p(0,1.04));ctx.bezierCurveTo(...p(-.3,1.06),...p(-.62,.98),...p(-.84,.60))}else if(style==='fringe'){ctx.moveTo(...p(-.84,.62));ctx.bezierCurveTo(...p(-1,.20),...p(-.98,-.24),...p(-.74,-.50));[[-.60,-.90],[-.38,-.68],[-.15,-.98],[.08,-.70],[.31,-.98],[.50,-.68],[.72,-.88],[.75,-.50]].forEach(q=>ctx.lineTo(...p(...q)));ctx.bezierCurveTo(...p(1,-.25),...p(1,.24),...p(.84,.62));ctx.bezierCurveTo(...p(.62,.98),...p(.27,1.06),...p(0,1.04));ctx.bezierCurveTo(...p(-.3,1.06),...p(-.62,.98),...p(-.84,.62))}else ctx.arc(0,0,r,0,Math.PI*2);ctx.closePath()}
function drawEyes(r){const set=eyes[look.eyes]||eyes.dots,s=r*1.05/62;ctx.save();ctx.translate(-31*s,-r*.20-6*s);ctx.scale(s,s);ctx.strokeStyle='#08090a';ctx.lineCap='round';ctx.lineJoin='round';for(const q of set){ctx.lineWidth=q.w;ctx.stroke(new Path2D(q.d))}ctx.restore()}
function drawNose(r){const s=r*.58/38;ctx.save();ctx.translate(-9*s,-r*.30);ctx.scale(s,s);ctx.strokeStyle='#08090a';ctx.lineWidth=4.4;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke(new Path2D(noses[look.nose]||noses.curve));ctx.restore()}
function mouthSamples(name){if(sampleCache.has(name))return sampleCache.get(name);const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',mouths[name].d);const len=p.getTotalLength(),pts=[];for(let i=0;i<=36;i++){const t=i/36,q=p.getPointAtLength(len*t);pts.push({x:q.x,y:q.y,t})}sampleCache.set(name,pts);return pts}
function drawMouth(r,state=talkState){const name=mouths[look.mouth]?look.mouth:'line',def=mouths[name],pts=mouthSamples(name),s=r*.85/44;ctx.save();ctx.translate(-22*s,r*.48-9*s);ctx.scale(s,s);ctx.lineCap='round';ctx.lineJoin='round';if(state===0){ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y);ctx.strokeStyle='#08090a';ctx.lineWidth=4.6;ctx.stroke()}else{const amt=def.open*(state===1?.38:1),up=[],lo=[];for(const p of pts){const taper=Math.pow(Math.sin(Math.PI*p.t),.68),spread=amt*taper;up.push({x:p.x,y:p.y-spread*.30});lo.push({x:p.x,y:p.y+spread*.72})}ctx.beginPath();ctx.moveTo(up[0].x,up[0].y);for(let i=1;i<up.length;i++)ctx.lineTo(up[i].x,up[i].y);for(let i=lo.length-1;i>=0;i--)ctx.lineTo(lo[i].x,lo[i].y);ctx.closePath();ctx.fillStyle='#08090a';ctx.fill()}ctx.restore()}
function limb(x1,y1,x2,y2,w){ctx.lineCap='round';ctx.strokeStyle='#08090a';ctx.lineWidth=w+8;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.strokeStyle=look.color;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}function joint(x,y,r){ctx.fillStyle='#08090a';ctx.beginPath();ctx.arc(x,y,r+4,0,Math.PI*2);ctx.fill();ctx.fillStyle=look.color;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}
function draw(){ctx.clearRect(0,0,c.width,c.height);const x=310,y=252;limb(x-30,y-55,x-85,y+4,26);limb(x-85,y+4,x-118,y+74,23);limb(x+30,y-55,x+74,y+15,26);limb(x+74,y+15,x+116,y+55,23);limb(x-18,y+67,x-30,y+158,30);limb(x-30,y+158,x-48,y+222,26);limb(x+18,y+67,x+30,y+158,30);limb(x+30,y+158,x+55,y+222,26);ctx.fillStyle='#08090a';ctx.roundRect(x-48,y-76,96,150,28);ctx.fill();ctx.fillStyle=look.color;ctx.roundRect(x-43,y-71,86,140,23);ctx.fill();for(const [jx,jy,r] of [[x-118,y+74,15],[x+116,y+55,15],[x-48,y+222,15],[x+55,y+222,15]])joint(jx,jy,r);const hx=x,hy=y-137,r=52;ctx.save();ctx.translate(hx,hy);headPath(look.headStyle,r);ctx.fillStyle=look.color;ctx.fill();ctx.strokeStyle='#08090a';ctx.lineWidth=6;ctx.lineJoin='round';ctx.stroke();drawEyes(r);drawNose(r);const eyeY=-r*.20,ex=r*.31;ctx.strokeStyle=ctx.fillStyle='#08090a';ctx.lineCap='round';if(look.extra==='glasses'){ctx.lineWidth=3;for(const s of [-1,1]){ctx.beginPath();ctx.arc(s*ex,eyeY,r*.22,0,Math.PI*2);ctx.stroke()}ctx.beginPath();ctx.moveTo(-ex+r*.22,eyeY);ctx.lineTo(ex-r*.22,eyeY);ctx.stroke()}if(look.extra==='eyepatch'){ctx.beginPath();ctx.arc(ex,eyeY,r*.19,0,Math.PI*2);ctx.fill();ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-r*.72,-r*.48);ctx.lineTo(r*.72,eyeY);ctx.stroke()}if(look.extra==='freckles'){for(const q of [-.43,-.3,-.17,.17,.3,.43]){ctx.beginPath();ctx.arc(r*q,r*.10+(Math.abs(q)>.35?r*.03:0),r*.027,0,Math.PI*2);ctx.fill()}}drawMouth(r);if(look.extra==='moustache'){ctx.beginPath();ctx.ellipse(-r*.13,r*.34,r*.2,r*.09,-.25,0,Math.PI*2);ctx.ellipse(r*.13,r*.34,r*.2,r*.09,.25,0,Math.PI*2);ctx.fill()}ctx.restore()}
const qs=new URLSearchParams(location.search),room=String(qs.get('room')||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,8),join=document.querySelector('#join');join.disabled=!room;join.textContent=room?`Join ${room}`:'Open an invite to join';join.onclick=()=>{if(room)location.href=`./?mode=controller&room=${encodeURIComponent(room)}`};document.querySelector('#start').onclick=()=>{location.href='./?from=creator'};
renderControls();save();
</script>
</body>
</html>
