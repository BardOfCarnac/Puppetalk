<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#0b0c0e" />
<title>Puppetalk · Join</title>
<style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b0c0e;color:#f4f5f7}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#0b0c0e}button,input{font:inherit;color:inherit}body{min-height:100dvh;overflow-x:hidden;background:radial-gradient(circle at 60% 30%,#25282f 0,#15171b 37%,#0b0c0e 75%)}.shell{min-height:100dvh;display:grid;grid-template-rows:auto minmax(300px,1fr) auto}header{padding:max(14px,env(safe-area-inset-top)) 18px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:900;letter-spacing:.14em;font-size:13px}.room{font-size:11px;color:#9da1aa;text-align:right}.stage{position:relative;min-height:340px;display:grid;place-items:center;overflow:hidden}.stage:before{content:"";position:absolute;left:50%;bottom:7%;width:min(58vw,330px);height:54px;transform:translateX(-50%);border-radius:50%;background:rgba(0,0,0,.38);filter:blur(4px)}canvas{width:min(92vw,620px);height:min(56vh,520px);display:block;position:relative;z-index:1}.hint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#777d87}.panel{background:rgba(16,18,22,.97);border-top:1px solid rgba(255,255,255,.1);border-radius:24px 24px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -14px 40px rgba(0,0,0,.28)}.join-stack{display:grid;gap:10px}.name-row{display:grid;grid-template-columns:70px 1fr;gap:10px;align-items:center}.label{font-size:10px;font-weight:800;color:#8f949d;text-transform:uppercase;letter-spacing:.08em}.name-input{width:100%;min-height:48px;border-radius:14px;border:1px solid rgba(255,255,255,.14);background:#17191e;padding:0 14px;font-size:17px;font-weight:800;outline:none}.name-input:focus{border-color:#fff}.main-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.main-actions button,.editor-head button{min-height:46px;border-radius:14px;border:1px solid rgba(255,255,255,.14);background:#191c21;font-weight:800}.main-actions .primary{background:#f0f2f5;color:#101216}.main-actions button:disabled{opacity:.4}.editor{display:none;margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,.09)}.editor.open{display:block}.editor-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}.editor-head strong{font-size:15px}.editor-head div{display:flex;gap:7px}.editor-head button{min-height:40px;padding:0 12px;font-size:12px}.editor-head button:disabled{opacity:.38}.section{display:grid;grid-template-columns:70px minmax(0,1fr);gap:10px;align-items:center;margin:9px 0}.choices{display:flex;gap:7px;overflow-x:auto;padding:3px 2px 5px;scrollbar-width:none}.choices::-webkit-scrollbar{display:none}.choice{flex:0 0 auto;min-width:58px;height:40px;border:1px solid rgba(255,255,255,.12);background:#17191e;border-radius:12px;padding:7px 9px;font-size:11px;text-transform:capitalize}.choice.active{border-color:#fff;background:#eceff3;color:#101216;font-weight:800}.swatch{flex:0 0 32px;width:32px;height:32px;border-radius:50%;border:2px solid rgba(255,255,255,.14);background:var(--c);padding:0;box-shadow:inset 0 0 0 2px rgba(0,0,0,.18)}.swatch.active{outline:2px solid #fff;outline-offset:2px}.note{margin-top:10px;font-size:10px;color:#7f848e;line-height:1.4}@media(min-width:800px){.shell{grid-template-columns:minmax(360px,1fr) minmax(390px,470px);grid-template-rows:auto 1fr}.shell header{grid-column:1/-1}.stage{grid-column:1;grid-row:2;min-height:0}.panel{grid-column:2;grid-row:2;border-radius:24px 0 0 0;border-left:1px solid rgba(255,255,255,.08);overflow:auto;padding:24px}.section,.name-row{grid-template-columns:84px 1fr}}
</style>
</head>
<body>
<main class="shell">
<header><div class="brand">PUPPETALK</div><div class="room" id="room-label"></div></header>
<section class="stage"><canvas id="preview" width="620" height="540" aria-label="Puppet preview"></canvas><div class="hint">this is who you got</div></section>
<section class="panel">
  <div class="join-stack">
    <div class="name-row"><div class="label">Name</div><input id="name" class="name-input" maxlength="24" autocomplete="nickname" placeholder="Your name" /></div>
    <div class="main-actions"><button id="edit" type="button">Edit character</button><button id="enter" type="button" class="primary">Join table</button></div>
  </div>
  <div class="editor" id="editor">
    <div class="editor-head"><strong>Edit character</strong><div><button id="talk" type="button">Hold to talk</button><button id="reroll" type="button">Reroll · 1 left</button></div></div>
    <div class="section"><div class="label">Colour</div><div class="choices" id="colors"></div></div>
    <div class="section"><div class="label">Head</div><div class="choices" data-key="headStyle"></div></div>
    <div class="section"><div class="label">Eyes</div><div class="choices" data-key="eyes"></div></div>
    <div class="section"><div class="label">Nose</div><div class="choices" data-key="nose"></div></div>
    <div class="section"><div class="label">Mouth</div><div class="choices" data-key="mouth"></div></div>
    <div class="section"><div class="label">Extra</div><div class="choices" data-key="extra"></div></div>
    <div class="note">You get one fresh throw of the whole character. After that, individual features can still be changed as much as you like.</div>
  </div>
</section>
</main>
<script>
const qs=new URLSearchParams(location.search);const cleanRoom=v=>String(v||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,8);function makeRoom(){const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',b=new Uint8Array(6);crypto.getRandomValues(b);return Array.from(b,x=>chars[x%chars.length]).join('')}const suppliedRoom=cleanRoom(qs.get('room')),isHost=qs.get('host')==='1'||!suppliedRoom,room=suppliedRoom||makeRoom();document.querySelector('#room-label').textContent=isHost?`starting room ${room}`:`joining room ${room}`;document.querySelector('#enter').textContent=isHost?'Start table':'Join table';
const palette=['#cf6c63','#d0a950','#7089b9','#729d78','#a879b2','#67a7a8','#d79b75','#8a6d5b','#d9c3a7','#7e8794','#d65050','#5b8fd1'];
const parts={headStyle:['smooth','spikes','tallSpikes','burst','scallop','tufts','swept','fringe'],eyes:['closed','dots','happy','mismatch','sleepy','unevenDots','wink','winkRight'],nose:['angular','bow','curve','hook','long','slant'],mouth:['frown','line','pleased','shy','smile','smirk','soft','wavy'],extra:['none','glasses','moustache','freckles','eyepatch']};
const eyes={closed:[{d:'M6 5q6 5 13 0m24 0q7 5 13 0',w:4.2}],dots:[{d:'M12 6h.01M50 6h.01',w:7}],happy:[{d:'M6 7q6-6 13 0m24 0q7-6 13 0',w:4.2}],mismatch:[{d:'M6 5q6 5 13 0m24 1q7 1.5 13 0',w:4.2}],sleepy:[{d:'M6 6q7 1.5 13 0m24 0q7 1.5 13 0',w:4.2}],unevenDots:[{d:'M12 4.5h.01M50 7.5h.01',w:7}],wink:[{d:'M6 5q6 5 13 0',w:4.2},{d:'M50 6h.01',w:7}],winkRight:[{d:'M12 6h.01',w:7},{d:'M43 5q7 5 13 0',w:4.2}]};
const noses={angular:'M13 6 7 26l8 2.5',bow:'M13 5c-5.5 8-8 16-6 24',curve:'M12 6c-2.5 8-7 15-6 22q.5 5 6 4',hook:'M13 5 5.5 27q-1 6.5 5.5 5.5',long:'M15 3 4 30q-1.5 5.5 6 5',slant:'M13 5 6 29'};
const mouths={frown:{d:'M7 11q15-6.5 29-1',open:11},line:{d:'m8 10 28-2',open:12},pleased:{d:'M4 9q16 7 30-1l7-5',open:13},shy:{d:'M15 9.5q8 4 16-1',open:9},smile:{d:'M3 9q19 10 38-3',open:14},smirk:{d:'M9 10q14 4 26-4',open:12},soft:{d:'M6 9q16 6 32-2',open:12},wavy:{d:'M6 10q7-4 14 0 8 4.5 18-2',open:12}};
const pick=a=>a[Math.floor(Math.random()*a.length)];function randomLook(){return{color:pick(palette),headStyle:pick(parts.headStyle),eyes:pick(parts.eyes),nose:pick(parts.nose),mouth:pick(parts.mouth),extra:pick(parts.extra)}}const sessionKey=`puppetalk-lobby:${isHost?'host':'join'}:${room}`;let lobbyState=null;try{lobbyState=JSON.parse(sessionStorage.getItem(sessionKey)||'null')}catch{}if(!lobbyState?.look)lobbyState={look:randomLook(),rerollUsed:false};let look=lobbyState.look;function persist(){lobbyState.look=look;sessionStorage.setItem(sessionKey,JSON.stringify(lobbyState));localStorage.setItem('puppetalk-look',JSON.stringify(look));renderControls();draw()}
const nameInput=document.querySelector('#name');try{nameInput.value=localStorage.getItem('puppetalk-name')||''}catch{}function cleanName(v){return String(v||'').trim().replace(/\s+/g,' ').slice(0,24)}function updateEnter(){document.querySelector('#enter').disabled=!cleanName(nameInput.value)}nameInput.addEventListener('input',updateEnter);updateEnter();
const editor=document.querySelector('#editor'),edit=document.querySelector('#edit');edit.onclick=()=>{const open=!editor.classList.contains('open');editor.classList.toggle('open',open);edit.textContent=open?'Done editing':'Edit character'};
const reroll=document.querySelector('#reroll');function refreshReroll(){reroll.disabled=!!lobbyState.rerollUsed;reroll.textContent=lobbyState.rerollUsed?'Reroll used':'Reroll · 1 left'}reroll.onclick=()=>{if(lobbyState.rerollUsed)return;lobbyState.rerollUsed=true;look=randomLook();persist();refreshReroll()};refreshReroll();
function pretty(v){return v.replace(/([a-z])([A-Z])/g,'$1 $2')}function choice(v,key){const b=document.createElement('button');b.type='button';b.className='choice'+(look[key]===v?' active':'');b.textContent=pretty(v);b.onclick=()=>{look[key]=v;persist()};return b}function renderControls(){const colors=document.querySelector('#colors');colors.innerHTML='';for(const color of palette){const b=document.createElement('button');b.type='button';b.className='swatch'+(look.color===color?' active':'');b.style.setProperty('--c',color);b.onclick=()=>{look.color=color;persist()};colors.append(b)}for(const[key,vals]of Object.entries(parts)){const row=document.querySelector(`[data-key="${key}"]`);row.innerHTML='';vals.forEach(v=>row.append(choice(v,key)))}}
const c=document.querySelector('#preview'),ctx=c.getContext('2d'),sampleCache=new Map();let talkState=0,talkTimer=null;function headPath(style,r){const p=(x,y)=>[x*r,y*r];ctx.beginPath();if(style==='smooth')ctx.arc(0,0,r,0,Math.PI*2);else if(style==='burst'){ctx.moveTo(...p(-.76,.68));[[-1.05,.30],[-.82,.05],[-1.08,-.18],[-.78,-.35],[-.92,-.70],[-.55,-.67],[-.48,-1.03],[-.18,-.78],[.02,-1.12],[.20,-.77],[.52,-1.02],[.56,-.65],[.94,-.72],[.80,-.35],[1.08,-.16],[.82,.05],[1.04,.32],[.76,.68]].forEach(q=>ctx.lineTo(...p(...q)));ctx.bezierCurveTo(...p(.55,.98),...p(.25,1.06),...p(0,1.04));ctx.bezierCurveTo(...p(-.28,1.06),...p(-.55,.98),...p(-.76,.68))}else{const maps={spikes:[[-.82,.58],[-.72,-.58],[-.60,-.94],[-.42,-.66],[-.20,-1.02],[0,-.68],[.22,-1.03],[.42,-.66],[.62,-.92],[.73,-.56],[.82,.58]],tallSpikes:[[-.78,.62],[-.68,-.48],[-.58,-1.12],[-.34,-.64],[-.18,-1.28],[.04,-.66],[.24,-1.22],[.43,-.61],[.61,-1.08],[.72,-.48],[.78,.62]],fringe:[[-.84,.62],[-.74,-.50],[-.60,-.90],[-.38,-.68],[-.15,-.98],[.08,-.70],[.31,-.98],[.50,-.68],[.72,-.88],[.75,-.50],[.84,.62]],scallop:[[-.84,.62],[-.72,-.48],[-.55,-.82],[-.34,-.68],[-.16,-1.00],[.04,-.72],[.24,-1.00],[.43,-.68],[.65,-.86],[.76,-.48],[.84,.62]],tufts:[[-.83,.62],[-.67,-.55],[-.50,-1.00],[-.25,-.68],[-.05,-1.18],[.15,-.68],[.48,-1.08],[.68,-.52],[.83,.62]],swept:[[-.84,.60],[-.64,-.55],[-.36,-.90],[.03,-.72],[.25,-1.18],[.32,-.82],[.69,-.98],[.68,-.55],[.84,.60]]};const pts=maps[style]||maps.spikes;ctx.moveTo(...p(...pts[0]));for(let i=1;i<pts.length;i++)ctx.lineTo(...p(...pts[i]));ctx.bezierCurveTo(...p(.62,.98),...p(.27,1.06),...p(0,1.04));ctx.bezierCurveTo(...p(-.3,1.06),...p(-.62,.98),...p(...pts[0]))}ctx.closePath()}
function mouthSamples(name){if(sampleCache.has(name))return sampleCache.get(name);const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',mouths[name].d);const len=p.getTotalLength(),pts=[];for(let i=0;i<=36;i++){const t=i/36,q=p.getPointAtLength(len*t);pts.push({x:q.x,y:q.y,t})}sampleCache.set(name,pts);return pts}function drawFace(r){const s=2*r/100;ctx.save();ctx.translate(-50*s,-50*s);ctx.scale(s,s);ctx.strokeStyle='#08090a';ctx.fillStyle='#08090a';ctx.lineCap='round';ctx.lineJoin='round';for(const q of eyes[look.eyes]||eyes.dots){ctx.lineWidth=q.w;ctx.save();ctx.translate(19,33);ctx.stroke(new Path2D(q.d));ctx.restore()}ctx.save();ctx.translate(40,28);ctx.lineWidth=4.4;ctx.stroke(new Path2D(noses[look.nose]||noses.curve));ctx.restore();const name=mouths[look.mouth]?look.mouth:'line',pts=mouthSamples(name),def=mouths[name];ctx.save();ctx.translate(30,63);if(!talkState){ctx.lineWidth=4.6;ctx.stroke(new Path2D(def.d))}else{const amt=def.open*(talkState===1?.38:1),up=[],lo=[];for(const p of pts){const taper=Math.pow(Math.sin(Math.PI*p.t),.68),spread=amt*taper;up.push({x:p.x,y:p.y-spread*.30});lo.push({x:p.x,y:p.y+spread*.72})}ctx.beginPath();ctx.moveTo(up[0].x,up[0].y);for(let i=1;i<up.length;i++)ctx.lineTo(up[i].x,up[i].y);for(let i=lo.length-1;i>=0;i--)ctx.lineTo(lo[i].x,lo[i].y);ctx.closePath();ctx.fill()}ctx.restore();if(look.extra==='glasses'){ctx.lineWidth=3;for(const x of [31,69]){ctx.beginPath();ctx.arc(x,39,10,0,Math.PI*2);ctx.stroke()}ctx.beginPath();ctx.moveTo(41,39);ctx.lineTo(59,39);ctx.stroke()}if(look.extra==='eyepatch'){ctx.beginPath();ctx.arc(69,39,8,0,Math.PI*2);ctx.fill();ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(20,25);ctx.lineTo(78,42);ctx.stroke()}if(look.extra==='freckles'){for(const[x,y]of[[31,56],[38,57],[44,56],[56,56],[62,57],[69,56]]){ctx.beginPath();ctx.arc(x,y,1.4,0,Math.PI*2);ctx.fill()}}if(look.extra==='moustache'){ctx.beginPath();ctx.ellipse(45,68,8,4,-.2,0,Math.PI*2);ctx.ellipse(55,68,8,4,.2,0,Math.PI*2);ctx.fill()}ctx.restore()}
function limb(x1,y1,x2,y2,w){ctx.lineCap='round';ctx.strokeStyle='#08090a';ctx.lineWidth=w+8;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.strokeStyle=look.color;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}function joint(x,y,r){ctx.fillStyle='#08090a';ctx.beginPath();ctx.arc(x,y,r+4,0,Math.PI*2);ctx.fill();ctx.fillStyle=look.color;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}function draw(){ctx.clearRect(0,0,c.width,c.height);const x=310,y=252;limb(x-30,y-55,x-85,y+4,26);limb(x-85,y+4,x-118,y+74,23);limb(x+30,y-55,x+74,y+15,26);limb(x+74,y+15,x+116,y+55,23);limb(x-18,y+67,x-30,y+158,30);limb(x-30,y+158,x-48,y+222,26);limb(x+18,y+67,x+30,y+158,30);limb(x+30,y+158,x+55,y+222,26);ctx.fillStyle='#08090a';ctx.roundRect(x-48,y-76,96,150,28);ctx.fill();ctx.fillStyle=look.color;ctx.roundRect(x-43,y-71,86,140,23);ctx.fill();for(const[a,b,r]of[[x-118,y+74,15],[x+116,y+55,15],[x-48,y+222,15],[x+55,y+222,15]])joint(a,b,r);ctx.save();ctx.translate(x,y-137);const r=52;headPath(look.headStyle,r);ctx.fillStyle=look.color;ctx.fill();ctx.strokeStyle='#08090a';ctx.lineWidth=6;ctx.lineJoin='round';ctx.stroke();drawFace(r);ctx.restore()}
const talk=document.querySelector('#talk');function startTalk(e){e.preventDefault();if(talkTimer)return;let phase=0;talkTimer=setInterval(()=>{phase=(phase+1)%3;talkState=phase===0?1:phase===1?2:1;draw()},105);talkState=1;draw()}function stopTalk(){clearInterval(talkTimer);talkTimer=null;talkState=0;draw()}talk.addEventListener('pointerdown',startTalk);talk.addEventListener('pointerup',stopTalk);talk.addEventListener('pointercancel',stopTalk);talk.addEventListener('pointerleave',e=>{if(e.buttons)stopTalk()});
document.querySelector('#enter').onclick=()=>{const name=cleanName(nameInput.value);if(!name)return;localStorage.setItem('puppetalk-name',name);localStorage.setItem('puppetalk-look',JSON.stringify(look));sessionStorage.removeItem(sessionKey);const url=new URL('./',location.href);url.search='';url.searchParams.set('mode','controller');url.searchParams.set('room',room);url.searchParams.set('lobby','done');if(isHost)url.searchParams.set('host','1');location.href=url.href};renderControls();persist();refreshReroll();
</script>
</body>
</html>
