<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Hex Space Lab</title>
<style>
:root{color-scheme:dark;--bg:#0d1014;--panel:#151a20;--text:#f3f5f7;--muted:#9ca5b0;--green:#64f08a;--red:#ff6168;--blue:#7da9ff;--a:#ffd56b;--b:#cb8cff}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;touch-action:none}
#app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) minmax(220px,38vh);gap:8px;padding:8px}header{display:flex;gap:8px;align-items:center;overflow-x:auto;white-space:nowrap}.brand{font-size:13px;font-weight:800;letter-spacing:.08em}.pill,button{border:1px solid #39414b;background:#1a1f26;color:var(--text);border-radius:999px;padding:8px 12px;font:inherit;font-size:13px}.pill input{vertical-align:-1px}.panel{position:relative;border:1px solid #293039;border-radius:16px;overflow:hidden;background:var(--panel)}svg{width:100%;height:100%;display:block;touch-action:none}.hint{position:absolute;left:10px;bottom:8px;background:#090b0ecc;padding:5px 8px;border-radius:8px;color:#c8ced6;font-size:11px;pointer-events:none}#lower{display:grid;grid-template-columns:minmax(0,1fr) 150px}.controls{border-left:1px solid #2c333c;padding:9px;display:flex;flex-direction:column;gap:8px;background:#11151a}.views{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.views button{padding:6px}.views .active{outline:2px solid #8fd3ff}.row{display:grid;grid-template-columns:1fr 1fr;gap:6px}.readout{font-size:11px;line-height:1.45;color:#d4dae1;background:#0b0e12;padding:7px;border-radius:9px}.small{font-size:10px;line-height:1.25;color:var(--muted)}
@media(orientation:portrait){#app{grid-template-rows:auto minmax(0,53vh) minmax(0,1fr)}#lower{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}.controls{border-left:0;border-top:1px solid #2c333c;display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:6px;padding:6px}.views{grid-template-columns:repeat(6,1fr)}.readout,.small{display:none}}
</style>
</head>
<body>
<div id="app">
<header><div class="brand">HEX SPACE LAB</div><label class="pill"><input id="families" type="checkbox"> all plane families</label><label class="pill"><input id="snap" type="checkbox"> snap to 19 crossings</label><button id="reset">reset</button><span id="status" class="small"></span></header>
<section class="panel"><svg id="world" viewBox="-1.35 -1.22 2.7 2.44"></svg><div class="hint">Shared space · drag A/B · tap a numbered vertex for that view</div></section>
<section class="panel" id="lower"><div style="position:relative;min-height:0"><svg id="flat" viewBox="0 0 1000 350" preserveAspectRatio="none"></svg><div class="hint">Flattened view · drag sideways; FAR/NEAR changes depth plane</div></div><aside class="controls"><div class="views" id="views"></div><div class="row"><button id="far">← FAR</button><button id="near">NEAR →</button></div><div class="row"><button id="pickA">A</button><button id="pickB">B</button></div><div class="readout" id="readout"></div><div class="small">Seven exact plane positions: −1, −½, −¼, 0, ¼, ½, 1. All 19 blue crossings lie on one of those seven planes from every viewpoint.</div></aside></section>
</div>
<script>
(()=>{'use strict';
const NS='http://www.w3.org/2000/svg', TAU=Math.PI*2, EPS=1e-7, LEVELS=[-1,-.5,-.25,0,.25,.5,1];
const world=document.querySelector('#world'),flat=document.querySelector('#flat'),families=document.querySelector('#families'),snap=document.querySelector('#snap'),readout=document.querySelector('#readout'),status=document.querySelector('#status');
const V=Array.from({length:6},(_,i)=>{const a=-Math.PI/2+i*Math.PI/3;return{x:Math.cos(a),y:Math.sin(a)}}), pairs=[];for(let i=0;i<6;i++)for(let j=i+1;j<6;j++)pairs.push([i,j]);
let viewer=0,selected='A',drag=null;const C={A:{x:-.28,y:.08},B:{x:.38,y:.12}},COL={A:'#ffd56b',B:'#cb8cff'};
const dot=(a,b)=>a.x*b.x+a.y*b.y,clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),d2=(a,b)=>(a.x-b.x)**2+(a.y-b.y)**2;
function side(v=viewer){const d=V[v];return{d,r:{x:-d.y,y:d.x}}}function vc(p,v=viewer){const{d,r}=side(v);return{x:dot(p,r),z:dot(p,d)}}function wc(x,z,v=viewer){const{d,r}=side(v);return{x:r.x*x+d.x*z,y:r.y*x+d.y*z}}
function inter(a,b,c,d){const rx=b.x-a.x,ry=b.y-a.y,sx=d.x-c.x,sy=d.y-c.y,den=rx*sy-ry*sx;if(Math.abs(den)<EPS)return null;const qx=c.x-a.x,qy=c.y-a.y,t=(qx*sy-qy*sx)/den,u=(qx*ry-qy*rx)/den;return t>=-EPS&&t<=1+EPS&&u>=-EPS&&u<=1+EPS?{x:a.x+t*rx,y:a.y+t*ry}:null}
const N=(()=>{const a=[...V];for(let i=0;i<pairs.length;i++)for(let j=i+1;j<pairs.length;j++){const p=inter(V[pairs[i][0]],V[pairs[i][1]],V[pairs[j][0]],V[pairs[j][1]]);if(p)a.push(p)}const o=[];a.forEach(p=>{if(!o.some(q=>d2(p,q)<1e-9))o.push(p)});return o})();
function inside(p){for(let i=0;i<6;i++){const a=V[i],b=V[(i+1)%6],cross=(b.x-a.x)*(p.y-a.y)-(b.y-a.y)*(p.x-a.x);if(cross<-EPS)return false}return true}
function nearestSeg(p,a,b){const vx=b.x-a.x,vy=b.y-a.y,t=clamp(((p.x-a.x)*vx+(p.y-a.y)*vy)/(vx*vx+vy*vy),0,1);return{x:a.x+vx*t,y:a.y+vy*t}}
function clampHex(p){if(inside(p))return p;let best=V[0],bd=Infinity;for(let i=0;i<6;i++){const q=nearestSeg(p,V[i],V[(i+1)%6]),dd=d2(p,q);if(dd<bd){bd=dd;best=q}}return best}
function nearestNode(p,filter){let best=p,bd=Infinity;for(const n of N){if(filter&&!filter(n))continue;const dd=d2(p,n);if(dd<bd){bd=dd;best=n}}return{x:best.x,y:best.y}}
function nearestLevel(z){let bi=0,bd=Infinity;LEVELS.forEach((q,i)=>{const dd=Math.abs(z-q);if(dd<bd){bd=dd;bi=i}});return bi}
function rangeAt(v,z){const xs=[];for(let i=0;i<6;i++){const a=vc(V[i],v),b=vc(V[(i+1)%6],v);if(Math.abs(a.z-z)<EPS)xs.push(a.x);if(Math.abs(b.z-z)<EPS)xs.push(b.x);if((z-a.z)*(z-b.z)<-EPS){const t=(z-a.z)/(b.z-a.z);xs.push(a.x+(b.x-a.x)*t)}}return{min:Math.min(...xs),max:Math.max(...xs)}}
function el(tag,attrs={},parent){const n=document.createElementNS(NS,tag);Object.entries(attrs).forEach(([k,v])=>n.setAttribute(k,v));if(parent)parent.appendChild(n);return n}function line(a,b,attrs,p){return el('line',{x1:a.x,y1:a.y,x2:b.x,y2:b.y,...attrs},p)}
function planeFamily(v,opacity=.7){const g=el('g',{opacity},world);LEVELS.forEach((z,i)=>{const rr=rangeAt(v,z),a=wc(rr.min,z,v),b=wc(rr.max,z,v);line(a,b,{stroke:'#64f08a','stroke-width':v===viewer?.018:.009},g);if(v===viewer){const t=el('text',{x:b.x+.025,y:b.y+.015,fill:'#a8ffba','font-size':'.07'},g);t.textContent=i+1}})}
function worldPoint(e){const m=world.getScreenCTM().inverse();return new DOMPoint(e.clientX,e.clientY).matrixTransform(m)}function flatPoint(e){const m=flat.getScreenCTM().inverse();return new DOMPoint(e.clientX,e.clientY).matrixTransform(m)}
function renderWorld(){world.replaceChildren();const poly=el('polygon',{points:V.map(p=>`${p.x},${p.y}`).join(' '),fill:'#10151a',stroke:'#eef2f6','stroke-width':'.018'},world);if(families.checked){planeFamily(0,.16);planeFamily(1,.16);planeFamily(2,.16)}pairs.forEach(([i,j])=>line(V[i],V[j],{stroke:'#ff6168','stroke-width':'.008',opacity:.22},world));planeFamily(viewer,.72);N.forEach(p=>el('circle',{cx:p.x,cy:p.y,r:.032,fill:'#7da9ff',opacity:.72},world));V.forEach((p,i)=>{const q={x:p.x*1.12,y:p.y*1.12};el('circle',{cx:q.x,cy:q.y,r:.09,fill:i===viewer?'#8fd3ff':'#262d36',stroke:'#66707d','stroke-width':'.012','data-view':i},world);const t=el('text',{x:q.x,y:q.y+.025,fill:i===viewer?'#071017':'#fff','font-size':'.08','font-weight':'700','text-anchor':'middle','pointer-events':'none'},world);t.textContent=i+1});['A','B'].forEach(n=>{const p=C[n],g=el('g',{'data-char':n},world);el('circle',{cx:p.x,cy:p.y,r:.075,fill:COL[n],stroke:n===selected?'#fff':'#111','stroke-width':n===selected?'.022':'.012'},g);const t=el('text',{x:p.x,y:p.y+.025,fill:'#111','font-size':'.075','font-weight':'800','text-anchor':'middle','pointer-events':'none'},g);t.textContent=n})}
function flatPos(n){const v=vc(C[n]),k=(v.z+1)/2;return{x:500+(v.x/.91)*430,y:270+k*18,s:.72+k*.62,z:v.z}}
function puppet(n){const p=flatPos(n),g=el('g',{transform:`translate(${p.x} ${p.y}) scale(${p.s})`,'data-char':n},flat);el('circle',{cx:0,cy:-70,r:24,fill:COL[n],stroke:n===selected?'#fff':'#111','stroke-width':6},g);line({x:0,y:-45},{x:0,y:20},{stroke:n===selected?'#fff':'#111','stroke-width':7,'stroke-linecap':'round'},g);line({x:0,y:-25},{x:-45,y:10},{stroke:'#111','stroke-width':7,'stroke-linecap':'round'},g);line({x:0,y:-25},{x:45,y:10},{stroke:'#111','stroke-width':7,'stroke-linecap':'round'},g);line({x:0,y:20},{x:-32,y:70},{stroke:'#111','stroke-width':7,'stroke-linecap':'round'},g);line({x:0,y:20},{x:32,y:70},{stroke:'#111','stroke-width':7,'stroke-linecap':'round'},g);const t=el('text',{x:0,y:-62,fill:'#111','font-size':18,'font-weight':'800','text-anchor':'middle','pointer-events':'none'},g);t.textContent=n}
function renderFlat(){flat.replaceChildren();el('rect',{x:0,y:0,width:1000,height:350,fill:'#11161c'},flat);line({x:55,y:286},{x:945,y:286},{stroke:'#3a424d','stroke-width':2},flat);LEVELS.forEach((z,i)=>{const y=28+i*38;line({x:950,y},{x:975,y},{stroke:'#64f08a','stroke-width':3,opacity:.5},flat);const t=el('text',{x:940,y:y+4,fill:'#8f99a5','font-size':11,'text-anchor':'end'},flat);t.textContent=7-i});const lab=el('text',{x:22,y:28,fill:'#dbe0e6','font-size':16,'font-weight':'700'},flat);lab.textContent=`VIEW ${viewer+1} — same shared positions, flattened`;['A','B'].sort((a,b)=>vc(C[a]).z-vc(C[b]).z).forEach(puppet);updateReadout()}
function updateReadout(){const p=vc(C[selected]),i=nearestLevel(p.z),exact=Math.abs(p.z-LEVELS[i])<.012;readout.innerHTML=`<b>${selected}</b><br>view ${viewer+1}: ${p.z.toFixed(3)} → plane ${i+1}${exact?' ✓':''}<br>screen x ${p.x.toFixed(3)}<br>views 1–6: ${V.map((_,v)=>nearestLevel(vc(C[selected],v).z)+1).join(' · ')}`;status.textContent=`${N.length} crossings · view ${viewer+1}`;document.querySelectorAll('#views button').forEach((b,i)=>b.classList.toggle('active',i===viewer));document.querySelector('#pickA').classList.toggle('active',selected==='A');document.querySelector('#pickB').classList.toggle('active',selected==='B')}
function render(){renderWorld();renderFlat()}
function step(delta){const p=vc(C[selected]),idx=clamp(nearestLevel(p.z)+delta,0,6),z=LEVELS[idx],rr=rangeAt(viewer,z),x=clamp(p.x,rr.min,rr.max);let q=wc(x,z);if(snap.checked)q=nearestNode(q,n=>Math.abs(vc(n).z-z)<1e-5);C[selected]=q;render()}
world.addEventListener('pointerdown',e=>{const ch=e.target.closest?.('[data-char]')?.getAttribute('data-char');const vv=e.target.closest?.('[data-view]')?.getAttribute('data-view');if(ch){selected=ch;drag={where:'world',id:e.pointerId};world.setPointerCapture(e.pointerId);render()}else if(vv!=null){viewer=+vv;render()}});world.addEventListener('pointermove',e=>{if(!drag||drag.where!=='world'||drag.id!==e.pointerId)return;let p=clampHex(worldPoint(e));if(snap.checked)p=nearestNode(p);C[selected]=p;render()});world.addEventListener('pointerup',()=>drag=null);world.addEventListener('pointercancel',()=>drag=null);
flat.addEventListener('pointerdown',e=>{const ch=e.target.closest?.('[data-char]')?.getAttribute('data-char');if(ch)selected=ch;const p=vc(C[selected]);drag={where:'flat',id:e.pointerId,z:snap.checked?LEVELS[nearestLevel(p.z)]:p.z};flat.setPointerCapture(e.pointerId);render()});flat.addEventListener('pointermove',e=>{if(!drag||drag.where!=='flat'||drag.id!==e.pointerId)return;const p=flatPoint(e),rr=rangeAt(viewer,drag.z);let x=clamp(((p.x-500)/430)*.91,rr.min,rr.max),q=wc(x,drag.z);if(snap.checked)q=nearestNode(q,n=>Math.abs(vc(n).z-drag.z)<1e-5);C[selected]=q;render()});flat.addEventListener('pointerup',()=>drag=null);flat.addEventListener('pointercancel',()=>drag=null);
for(let i=0;i<6;i++){const b=document.createElement('button');b.textContent=i+1;b.onclick=()=>{viewer=i;render()};document.querySelector('#views').appendChild(b)}document.querySelector('#far').onclick=()=>step(-1);document.querySelector('#near').onclick=()=>step(1);document.querySelector('#pickA').onclick=()=>{selected='A';render()};document.querySelector('#pickB').onclick=()=>{selected='B';render()};document.querySelector('#reset').onclick=()=>{C.A={x:-.28,y:.08};C.B={x:.38,y:.12};viewer=0;selected='A';render()};families.onchange=render;snap.onchange=()=>{if(snap.checked){C.A=nearestNode(C.A);C.B=nearestNode(C.B)}render()};render();
})();
</script>
</body></html>
